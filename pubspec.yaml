name: repcommit
description: "A personal push-up tracking app inspired by GitHub contribution history."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.6
  google_sign_in: ^6.2.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # Local Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/REPcommit.png"
  adaptive_icon_background: "#0C0D0D"
  adaptive_icon_foreground: "assets/images/REPcommit.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/climb.mp3

